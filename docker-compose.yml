services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.2
    command: "-jar DynamoDBLocal.jar -sharedDb"
    ports:
      - "8000:8000"

  dynamodb-init:
    image: amazon/aws-cli:2.28.8
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command: -c "sleep 5 && aws dynamodb create-table --table-name url-shortner --attribute-definitions AttributeName=short_link,AttributeType=S --key-schema AttributeName=short_link,KeyType=HASH --billing-mode PAY_PER_REQUEST --endpoint-url http://dynamodb-local:8000 || true"

  backend:
    build:
      context: ./backend
    depends_on:
      - dynamodb-init
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      SHORTENER_TABLE_NAME: url-shortner
      SHORTENER_DOMAIN_BASE_URL: http://localhost:8080
      SHORTENER_DYNAMODB_ENDPOINT: http://dynamodb-local:8000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
